<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Polaris - Hyper-Personalized Astrology</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #f0f0f0;
            --accent: #d4af37;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        #app {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
        }
        .title {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 1rem;
            letter-spacing: 0.1em;
        }
        .subtitle {
            font-size: 1rem;
            color: #888;
            margin-bottom: 2rem;
        }
        .crystal-ball {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(212,175,55,0.4) 40%, rgba(0,0,0,0.9) 80%);
            box-shadow: 0 0 30px rgba(212,175,55,0.2), inset 0 0 50px rgba(255,255,255,0.2);
            margin: 0 auto 2rem;
            position: relative;
            animation: float 4s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .crystal-ball:active {
            transform: scale(0.95);
            box-shadow: 0 0 50px rgba(212,175,55,0.5), inset 0 0 20px rgba(255,255,255,0.5);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .result-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s, transform 0.5s;
            pointer-events: none;
        }
        .result-card.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .lucky-numbers {
            color: var(--accent);
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="title">POLARIS</div>
        <div class="subtitle">Your AI Destiny Guide</div>
        
        <div class="crystal-ball" id="triggerBtn" role="button" aria-label="Reveal Destiny"></div>
        
        <div class="result-card" id="resultCard">
            <div id="destinyText">Connecting to cosmic energies...</div>
            <div class="lucky-numbers" id="luckyNumbers"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const triggerBtn = document.getElementById('triggerBtn');
            const resultCard = document.getElementById('resultCard');
            const destinyText = document.getElementById('destinyText');
            const luckyNumbers = document.getElementById('luckyNumbers');

            triggerBtn.addEventListener('click', async () => {
                // Haptic feedback (Micro-interaction for native feel)
                if (navigator.vibrate) {
                    navigator.vibrate([50, 100, 50]);
                }

                // Add loading state
                destinyText.textContent = "Analyzing celestial data...";
                luckyNumbers.textContent = "";
                resultCard.classList.add('visible');

                try {
                    const response = await fetch('/api/fortune');
                    const result = await response.json();
                    
                    if (result.success) {
                        destinyText.textContent = result.data.destiny;
                        luckyNumbers.textContent = "Lucky Numbers: " + result.data.lucky_numbers.join(', ');
                        
                        if (navigator.vibrate) {
                            navigator.vibrate(200); // Success haptic
                        }
                    } else {
                        throw new Error("Failed to parse destiny");
                    }
                } catch (error) {
                    destinyText.textContent = "The stars are clouded today. Please try again later.";
                    if (navigator.vibrate) {
                        navigator.vibrate([200, 100, 200]); // Error haptic
                    }
                }
            });
        });
    </script>
</body>
</html>
